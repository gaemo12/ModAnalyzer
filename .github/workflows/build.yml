name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: mvn -q -DskipTests package -pl common,scanners,modscan-open -am
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ModScanOpen-jar
          path: modscan-open/target/ModScanOpen.jar
